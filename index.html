<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Зона активації бокового меню на лівому краї */
        .sidebar-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            z-index: 99;
        }

        /* Бокове меню з ефектом заблюрювання */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }

        .sidebar-trigger:hover ~ .sidebar,
        .sidebar:hover {
            left: 0;
        }

        .sidebar-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        /* Основний робочий простір */
        .main-content {
            margin-left: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-y: auto;
        }

        .panel-content {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .panel-content.active {
            display: block;
        }

        /* Стилі для блоку хітів відео */
        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 24px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .hits-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .hit-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .hit-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .hit-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .hit-stats {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .hit-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .placeholder-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Зона активації бокового меню -->
    <div class="sidebar-trigger"></div>

    <!-- Виїжджаюче бокове меню -->
    <aside class="sidebar">
        <div class="sidebar-title">Навігація</div>
        <ul class="menu-list">
            <li class="menu-item active" data-target="panel-hits">Хіти відео</li>
            <li class="menu-item" data-target="panel-2">Аналітика</li>
            <li class="menu-item" data-target="panel-3">Налаштування</li>
        </ul>
    </aside>

    <!-- Основний контент -->
    <main class="main-content">
        
        <!-- Функція 1: Хіти відео (тут виводяться реальні дані) -->
        <div id="panel-hits" class="panel-content active">
            <div class="dashboard-header">
                <h1>Хіти відео</h1>
                <p>Найуспішніші ролик за переглядами та показниками</p>
            </div>
            <div class="hits-grid" id="hits-container">
                <div class="hit-card">
                    <div class="hit-info">
                        <h3>Завантаження даних...</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Функція 2 -->
        <div id="panel-2" class="panel-content">
            <div class="placeholder-text">Розділ аналітики в розробці</div>
        </div>

        <!-- Функція 3 -->
        <div id="panel-3" class="panel-content">
            <div class="placeholder-text">Налаштування системи</div>
        </div>

    </main>

    <script>
        // Логіка перемикання вкладок меню
        const menuItems = document.querySelectorAll('.menu-item');
        const panels = document.querySelectorAll('.panel-content');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                item.classList.add('active');
                
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Завантаження реальних даних з твого файлу (наприклад, data.json)
        async function loadVideoData() {
            try {
                const response = await fetch('data.json'); // шлях до файлу з даними
                const data = await response.json();
                
                const container = document.getElementById('hits-container');
                container.innerHTML = '';

                // Припускаємо, що дані приходять у вигляді масиву або об'єкта з відео
                // Змініть `data.videos` під структуру вашого JSON-файлу
                const videos = data.videos || data; 

                videos.forEach((video, index) => {
                    const card = document.createElement('div');
                    card.className = 'hit-card';
                    card.innerHTML = `
                        <div class="hit-info">
                            <h3>${video.title}</h3>
                            <div class="hit-stats">Перегляди: ${Number(video.views).toLocaleString()} • CTR: ${video.ctr}%</div>
                        </div>
                        <div class="hit-badge">#${index + 1} Хіт</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Помилка завантаження даних:', error);
                document.getElementById('hits-container.innerHTML').innerHTML = `
                    <div class="hit-card"><div class="hit-info"><h3>Не вдалося завантажити дані</h3></div></div>
                `;
            }
        }

        loadVideoData();
    </script>

</body>
</html>
