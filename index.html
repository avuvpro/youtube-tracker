<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг Зальотів YouTube</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Притискаємо все до лівого краю */
        .container {
            width: 100% !important;
            max-width: 100% !important;
            margin: 0 !important;
            padding: 20px 10px !important;
        }

        h1 {
            text-align: left;
            margin-left: 10px;
            color: #ff4757;
        }

        /* Збільшена картка зальоту */
        .zalyot-card {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            padding: 24px 28px !important;
            margin-bottom: 24px !important;
            border-radius: 12px;
            border-left: 6px solid #ff4757;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Збільшене прев'ю відео зліва */
        .zalyot-card img {
            width: 320px !important;
            height: auto !important;
            border-radius: 8px;
            margin-right: 25px;
            flex-shrink: 0;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        /* Великий заголовок ролика */
        .zalyot-card h3 {
            margin: 0 0 12px 0;
        }

        .zalyot-card h3 a {
            font-size: 24px !important;
            color: #ffffff;
            text-decoration: none;
            line-height: 1.3;
        }

        .zalyot-card h3 a:hover {
            text-decoration: underline;
        }

        /* Збільшений текст статистики */
        .zalyot-card p {
            font-size: 17px !important;
            margin: 6px 0;
            color: #cccccc;
        }

        .percent {
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 Моніторинг Зальотів YouTube</h1>
        <div id="cards-container">
            <!-- Сюди динамічно завантажуються картки -->
        </div>
    </div>

    <script>
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('cards-container');
                container.innerHTML = '';

                if (data.length === 0) {
                    container.innerHTML = '<p style="margin-left: 10px;">Поки що немає нових зальотів за останні 7 днів.</p>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'zalyot-card';
                    card.innerHTML = `
                        <a href="${item.url}" target="_blank">
                            <img src="${item.thumbnail}" alt="Thumbnail">
                        </a>
                        <div class="info">
                            <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                            <p>👤 <strong>Автор:</strong> ${item.channel}</p>
                            <p>👁 <strong>Перегляди:</strong> ${item.views.toLocaleString()} (Норма: ${item.norm.toLocaleString()})</p>
                            <p>📊 <strong>Відхилення:</strong> <span class="percent">+${item.percent}%</span></p>
                            <p>⚡️ <strong>Швидкість:</strong> ${item.views_per_hour ? item.views_per_hour.toLocaleString() : 0} п/год</p>
                            <p>⏱ <strong>Викладено:</strong> ${item.time} (${item.relative_time || ''})</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Помилка завантаження data.json:', error));
    </script>

</body>
</html>
