<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мінімалістичний інтерфейс</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* Зона активації на лівому краї екрана */
        .sidebar-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 100%;
            z-index: 99;
        }

        /* Бокове меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px; /* Приховане за екраном */
            width: 280px; /* Ширина відповідає твоїй зеленій полосці */
            height: 100%;
            background: rgba(30, 30, 30, 0.45); /* Напівпрозорий фон */
            backdrop-filter: blur(20px); /* Сильне заблюрювання */
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
        }

        /* Показ меню при наведенні на лівий край або на саме меню */
        .sidebar-trigger:hover ~ .sidebar,
        .sidebar:hover {
            left: 0;
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.9);
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* Основний робочий простір */
        .main-content {
            margin-left: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: margin-left 0.3s;
        }

        .panel-content {
            display: none;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
        }

        .panel-content.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Невидима зона тригера на лівому краї -->
    <div class="sidebar-trigger"></div>

    <!-- Виїжджаюче бокове меню -->
    <aside class="sidebar">
        <div class="sidebar-title">Меню</div>
        <ul class="menu-list">
            <li class="menu-item active" data-target="panel-1">Функція 1</li>
            <li class="menu-item" data-target="panel-2">Функція 2</li>
            <li class="menu-item" data-target="panel-3">Функція 3</li>
        </ul>
    </aside>

    <!-- Основна зона, де відображаються вибрані функції -->
    <main class="main-content">
        <div id="panel-1" class="panel-content active">Вибрано: Функція 1</div>
        <div id="panel-2" class="panel-content">Вибрано: Функція 2</div>
        <div id="panel-3" class="panel-content">Вибрано: Функція 3</div>
    </main>

    <script>
        // Логіка перемикання функцій при кліку
        const menuItems = document.querySelectorAll('.menu-item');
        const panels = document.querySelectorAll('.panel-content');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                // Знімаємо активний клас з усіх пунктів та панелей
                menuItems.forEach(i => i.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                // Додаємо активний клас на вибраний пункт
                item.classList.add('active');
                
                // Показуємо відповідну панель
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>

</body>
</html>
