<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Tracker</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 50px;
            height: 100%;
            z-index: 99;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .sidebar-handle {
            width: 6px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 0 4px 4px 0;
            transition: all 0.2s ease;
        }

        .sidebar-trigger:hover .sidebar-handle {
            background: #ff334b;
            height: 60px;
            width: 8px;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
        }

        .sidebar-trigger:hover ~ .sidebar,
        .sidebar:hover,
        .sidebar.open {
            left: 0;
        }

        .sidebar-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
        }

        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .main-content {
            margin-left: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        .panel-content {
            display: none;
            width: 100%;
            max-width: 950px;
        }

        .panel-content.active {
            display: block;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 24px;
            font-weight: 500;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .dashboard-header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .hits-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hit-card {
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 20px;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .hit-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #ff334b;
        }

        .hit-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .video-thumb {
            width: 200px;
            height: 112px;
            border-radius: 8px;
            object-fit: cover;
            background: #2a2a2a;
            flex-shrink: 0;
        }

        .hit-details {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .hit-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
        }

        .hit-author {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .hit-stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 4px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .positive {
            color: #4ade80;
            font-weight: 500;
        }

        .hit-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .placeholder-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="sidebar-trigger" id="sidebarTrigger">
        <div class="sidebar-handle"></div>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-title">Меню</div>
        <ul class="menu-list">
            <li class="menu-item active" data-target="panel-hits">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                Хіти відео
            </li>
            <li class="menu-item" data-target="panel-analytics">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                Аналітика
            </li>
        </ul>
    </aside>

    <main class="main-content">
        <div id="panel-hits" class="panel-content active">
            <div class="dashboard-header">
                <h1>Хіти відео</h1>
                <p>Найуспішніші ролик за переглядами та показниками</p>
            </div>
            <div class="hits-grid" id="hits-container">
                <div class="hit-card">
                    <div class="hit-details">
                        <div class="hit-title">Завантаження даних...</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="panel-analytics" class="panel-content">
            <div class="dashboard-header">
                <h1>Аналітика</h1>
                <p>Загальна статистика каналу</p>
            </div>
            <div class="placeholder-text">Розділ аналітики</div>
        </div>
    </main>

    <script>
        const trigger = document.getElementById('sidebarTrigger');
        const sidebar = document.getElementById('sidebar');

        trigger.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        const menuItems = document.querySelectorAll('.menu-item');
        const panels = document.querySelectorAll('.panel-content');

        menuItems.forEach(item => {
            item.addEventListener('click', () => {
                menuItems.forEach(i => i.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));

                item.classList.add('active');
                
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
                sidebar.classList.remove('open');
            });
        });

        // Форматування чисел з відступами (наприклад: 582748 -> 582 748)
        function formatNumber(num) {
            if (num === undefined || num === null || num === '') return '—';
            return Number(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        }

        async function loadVideoData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                const container = document.getElementById('hits-container');
                container.innerHTML = '';

                const videos = data.videos || data;

                videos.forEach(video => {
                    const author = video.channel || video.author || 'Не вказано';
                    const views = formatNumber(video.views);
                    const norm = formatNumber(video.norm);
                    
                    // Форматування відхилення (+1892%)
                    let deviation = '—';
                    if (video.percent !== undefined && video.percent !== null) {
                        deviation = `+${formatNumber(video.percent)}%`;
                    }

                    const speed = formatNumber(video.views_per_hour);
                    
                    // Форматування дати як у попередньому варіанті (30 липня, 12:39 (3 дні тому))
                    let dateStr = '—';
                    if (video.time && video.relative_time) {
                        dateStr = `${video.time} (${video.relative_time})`;
                    } else if (video.time) {
                        dateStr = video.time;
                    } else if (video.published_at) {
                        dateStr = video.published_at;
                    }

                    const card = document.createElement('div');
                    card.className = 'hit-card';
                    card.innerHTML = `
                        <img src="${video.thumbnail || ''}" alt="Thumbnail" class="video-thumb">
                        <div class="hit-details">
                            <div class="hit-title">${video.title}</div>
                            <div class="hit-author">👤 Автор: ${author}</div>
                            <div class="hit-stats-row">
                                <div class="stat-item">👁 Перегляди: ${views} (Норма: ${norm})</div>
                                <div class="stat-item">📈 Відхилення: <span class="positive">${deviation}</span></div>
                                <div class="stat-item">⚡ Швидкість: ${speed} п/год</div>
                            </div>
                            <div class="hit-date">🕒 Викладено: ${dateStr}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Помилка завантаження даних:', error);
            }
        }

        loadVideoData();
    </script>
</body>
</html>
