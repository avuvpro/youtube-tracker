<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг Зальотів YouTube</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff4757;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
            border-left: 4px solid #ff4757;
        }
        .card img {
            width: 120px;
            height: 68px;
            border-radius: 4px;
            object-fit: cover;
        }
        .info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .info h3 a {
            color: #fff;
            text-decoration: none;
        }
        .info h3 a:hover {
            text-decoration: underline;
        }
        .info p {
            margin: 3px 0;
            color: #bbb;
            font-size: 14px;
        }
        .badge {
            color: #2ed573;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Моніторинг Зальотів YouTube</h1>
        <div id="content">Завантаження даних...</div>
    </div>

    <script>
        fetch('data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Файл не знайдено');
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('content');
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888;">Поки що немає даних про зальоти.</p>';
                    return;
                }
                
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="card">
                            <img src="${item.thumbnail}" alt="Thumbnail">
                            <div class="info">
                                <h3><a href="${item.url}" target="_blank">${item.title}</a></h3>
                                <p>👤 <b>Автор:</b> ${item.channel}</p>
                                <p>👁 <b>Перегляди:</b> ${item.views.toLocaleString()} (Норма: ${item.norm.toLocaleString()})</p>
                                <p>📈 Відхилення: <span class="badge">+${item.percent}%</span></p>
                                <p style="font-size: 12px; color: #777;">🕒 ${item.time}</p>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(error => {
                console.error('Помилка завантаження:', error);
                document.getElementById('content').innerHTML = '<p style="text-align:center; color:#ff4757;">Помилка завантаження даних або файл ще не створено.</p>';
            });
    </script>
</body>
</html>
